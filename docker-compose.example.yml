services:
  mssql-mcp-server:
    build: .
    environment:
      - MSSQL_SERVER=sqlserver  # the service name on the internal Docker network
      - MSSQL_DATABASE=TestDB
      - MSSQL_USER=sa
      - MSSQL_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PORT=1433
      # ODBC Driver 18 verifies the server certificate by default, and the
      # SQL Server container ships a self-signed one.
      - MSSQL_TRUST_SERVER_CERTIFICATE=true
      # elicit (default) asks before every write; allow disables the checkpoint.
      - MSSQL_APPROVAL_MODE=elicit
    depends_on:
      - sqlserver
    stdin_open: true
    tty: true

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
