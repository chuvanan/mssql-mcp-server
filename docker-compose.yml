services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD:-StrongPassword123!}
    ports:
      - "${HOST_SQL_PORT:-1434}:1433"
    healthcheck:
      # sqlcmd 18 lives in mssql-tools18 and needs -C to trust the
      # container's self-signed certificate.
      test: >-
        /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa
        -P "${MSSQL_PASSWORD:-StrongPassword123!}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    volumes:
      - mssql_data:/var/opt/mssql
    mem_limit: ${SQL_MEMORY_LIMIT:-2g}

  mcp_server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      - MSSQL_SERVER=${MSSQL_SERVER:-mssql}
      - MSSQL_PORT=${MSSQL_PORT:-1433}
      - MSSQL_USER=${MSSQL_USER:-sa}
      - MSSQL_PASSWORD=${MSSQL_PASSWORD:-StrongPassword123!}
      - MSSQL_DATABASE=${MSSQL_DATABASE:-master}
      # The container's certificate is self-signed, and ODBC Driver 18
      # verifies certificates by default.
      - MSSQL_TRUST_SERVER_CERTIFICATE=true
    stdin_open: true
    tty: true

volumes:
  mssql_data:
